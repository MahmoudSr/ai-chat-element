name: Deploy site

# Every action is pinned to a full commit SHA (version in the comment). A tag
# can be moved to point at different code; a SHA can't. Dependabot keeps the
# pins current (.github/dependabot.yml).

# Publishes the docs site and the playground to GitHub Pages:
#   https://mahmoudsr.github.io/ai-chat-element/             the docs
#   https://mahmoudsr.github.io/ai-chat-element/playground/  the playground
# (the old /examples/playground.html redirects to /playground/).
#
# Both import src/ directly, so they are built (npm run build:pages) rather
# than served as-is. Pages then hosts the static output.

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without an empty commit.
  workflow_dispatch:

# Needed by the Pages deploy action: id-token proves the build's identity.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a running one — a half-finished deploy
# would leave the live site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must match the Node/npm that generated package-lock.json. On 20 (npm 10)
      # `npm ci` rejects a lockfile written by npm 11 — it reads the nested
      # vitest->vite 5 entries as missing top-level deps and refuses to install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate the deploy on the suite: a broken site is worse than a stale one,
      # and this is the same browser the tests expect.
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - run: npm run build:pages

      # The home page must be one clean screen at every common window size
      # (no scroll, no covered strip name, no cut-off text).
      - run: npm run verify:home

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
